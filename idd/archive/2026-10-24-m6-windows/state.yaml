  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "En Windows sigue habiendo un único motor por usuario: LockFileEx sobre history.db.lock y control.lock excluye a un segundo, que sale con 4; la clave Run lo arranca con la sesión"
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "Windows se añade solo con adaptadores por sistema (filelock, control, probe, runkey, cmd) tras los mismos puertos; el dominio y app no cambian"
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "El historial mantiene un único escritor (bloqueo exclusivo con flock o LockFileEx) y el mismo esquema versionado; sin migración"
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "conforms",
      "reason": "En Windows el ICMP sin privilegios es IcmpSendEcho de iphlpapi, como ping.exe, y la ruta sale de GetIpForwardTable2; DNS igual; sin administrador ni puertos en red"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "El contrato v1 no cambia; en Windows va por el mismo socket AF_UNIX, solo del usuario por ACL protegida y comprobación del SID del par, como permite la consecuencia del ADR"
    },
    {
      "kind": "scenario",
      "id": "live-status",
      "impact": "conforms",
      "reason": "El icono de bandeja y ctl watch reciben el estado del motor igual que en Linux"
    },
    {
      "kind": "scenario",
      "id": "minimal-footprint",
      "impact": "conforms",
      "reason": "Un IcmpSendEcho por objetivo y sondeo, sin procesos externos; el log de Windows se limita a unos 2 MiB"
    },
    {
      "kind": "scenario",
      "id": "short-outage-detection",
      "impact": "conforms",
      "reason": "Mismo clasificador y sondeo cada 2 s; en Windows cambian solo las sondas de enlace y ping"
    }
  ],
  "attestations": [
    {
      "kind": "adr",
      "id": "0001",
      "evidence": "Revisado: cmd/netmon-tray/main.go sigue siendo el único punto de entrada; platform_windows.go solo añade rutas, log, plugin y service. El único manejador de la bandeja (Exportar historial) hace E/S de fichero, no de red; Windows no añade manejadores.",
      "recorded_at": "2026-10-24T01:41:18.406Z"
    },
    {
      "kind": "adr",
      "id": "0003",
      "evidence": "go test ./... en Linux: TestHistorySurvivesRestartRotatesAndExports (cmd/netmon-tray) reabre el almacén tras reinicio, rota a 60 días y exporta; las pruebas de migración y de dueño único de storage pasan con filelock. En Windows esas mismas pruebas corren en el job windows-latest, aún no ejecutado.",
      "recorded_at": "2026-10-24T01:41:18.465Z"
    },
    {
      "kind": "adr",
      "id": "0004",
      "evidence": "Pruebas del clasificador en internal/domain (corte de pocos segundos incluido) pasan sin cambios. Revisado: ninguna sonda requiere privilegios; en Windows ping usa IcmpSendEcho de iphlpapi (como ping.exe) y la ruta GetIpForwardTable2/GetIfEntry2Ex, sin administrador; la revisión de confianza no encontró nada.",
      "recorded_at": "2026-10-24T01:41:18.523Z"
    },
    {
      "kind": "adr",
      "id": "0005",
      "evidence": "En Linux pasan TestWatchSendsCurrentStateThenEachChange y TestRejectsOtherUsers (ahora con foreignOwner por sistema). En Windows, TestRejectsOtherUsers con el SID S-1-0-0, TestDirectoryIsPrivateToTheUser y TestCurrentOwnerIsThisProcessUser están escritas y pasan GOOS=windows go vet; su ejecución queda para el job windows-latest.",
      "recorded_at": "2026-10-24T01:41:18.582Z"
    },
    {
      "kind": "scenario",
      "id": "live-status",
      "evidence": "TestWatchSendsCurrentStateThenEachChange pasa en Linux; el icono de bandeja recibe Publish igual en Windows (mismo adaptador fyne.io/systray). Ningún manejador de interfaz hace E/S de red síncrona (revisado en main.go y tray.go).",
      "recorded_at": "2026-10-24T01:41:18.643Z"
    },
    {
      "kind": "scenario",
      "id": "minimal-footprint",
      "evidence": "Revisado: el sondeo sigue a intervalo fijo de 2 s; en Windows cada ping es un IcmpSendEcho con 6 bytes de datos y el DNS como mucho cada 10 s; el log de Windows se limita a unos 2 MiB. La medición de CPU/RAM en Windows queda para la prueba manual en un equipo real.",
      "recorded_at": "2026-10-24T01:41:18.703Z"
    },
    {
      "kind": "scenario",
      "id": "short-outage-detection",
      "evidence": "Las pruebas del clasificador con secuencias simuladas por capa, incluido un corte de pocos segundos (TestTrackerClosesShortOutageWithMeasuredDuration), pasan; el dominio no cambia en M6.",
      "recorded_at": "2026-10-24T01:41:18.764Z"
    }
  ],
