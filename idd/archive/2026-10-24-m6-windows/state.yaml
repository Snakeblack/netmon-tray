                "summary": ".github/workflows/release.yml:7-8 sets `permissions: contents: write` for the whole workflow. The windows-test job (lines 11-19) only runs checkout, `go vet` and `go test`, yet it runs with a write-scoped GITHUB_TOKEN. Only the publish step at line 71 needs write access. ci.yml:8-9 already uses `contents: read`.",
