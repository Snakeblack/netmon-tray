        "category": "inputs",
        "question": "Que ordenes y limites tiene el contrato v1?"
      },
      {
        "category": "uniqueness",
        "question": "Que pasa si ya hay otro motor o un socket huerfano?"
      },
      {
        "category": "persistence",
        "question": "Donde vive el socket, con que permisos y como se rechaza a otro UID?"
      },
      {
        "category": "copy",
