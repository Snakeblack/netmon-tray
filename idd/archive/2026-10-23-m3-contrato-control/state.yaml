  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "Sigue siendo un unico proceso de motor; el socket es una interfaz del mismo proceso y el segundo motor se rechaza antes de abrir el historial"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "Implementa el contrato local versionado por socket accesible solo al usuario (permisos 0700/0600 y SO_PEERCRED); el icono sigue en el motor; la prueba de contrato cubre emision de cambios y rechazo de otros UID"
    },
    {
      "kind": "scenario",
      "id": "live-status",
      "impact": "conforms",
      "reason": "watch emite el estado actual y cada cambio por el contrato; el servidor nunca bloquea al motor (Publish no espera al cliente) y no hay E/S de red sincrona en manejadores de interfaz"
    }
  ],
