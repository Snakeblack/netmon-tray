  "intent": {
    "kind": "feature",
    "summary": "El motor sirve un contrato de control local versionado v1 (status, watch, export) por socket Unix y el subcomando ctl lo consume",
    "acceptance": "ctl status devuelve el estado y el ultimo corte, ctl watch emite un evento por cada cambio de estado, ctl export escribe CSV/JSON y devuelve las rutas, y el socket rechaza a otros usuarios"
  },
