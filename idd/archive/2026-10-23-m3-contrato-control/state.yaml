  "gates": [
    {
      "id": "open-facts",
      "status": "resolved",
      "answer": "Ordenes v1: status + watch + export (Recomendado). Socket: como alexa-tray (XDG_RUNTIME_DIR/netmon-tray/control.sock, dir 0700, socket 0600; sin XDG_RUNTIME_DIR solo bandeja con WARN; otro motor responde -> sale con 1; huerfano se borra). Seguridad: permisos + SO_PEERCRED (Recomendado). ctl: como alexa-tray (subcomando del binario; status texto con --json, watch JSON por lineas, export; salida 0/1/2/3; mensajes en espanol, codigos en ingles)",
      "source": "user"
    }
