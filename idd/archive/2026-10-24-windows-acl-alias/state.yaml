  "intent": {
    "kind": "bug",
    "summary": "privateDir compara la ACL del directorio de control con una cadena construida con el SID literal, pero Windows la devuelve con alias de SID conocidos (LA para el Administrador local), así que nunca la reconoce como privada",
    "acceptance": "La comprobación compara la ACL leída con la forma canónica que Windows da a la ACL deseada (mismos alias), admite el indicador AI y rechaza ACE de más, herencia o permisos distintos; TestDirectoryIsPrivateToTheUser pasa en windows-latest"
  },
  "facts": {
    "basis": "El comportamiento deseado ya está fijado por m6-windows (ACL protegida con solo el usuario); solo cambia cómo se compara, y el fallo del CI (run 40053474542) muestra la forma exacta que devuelve Windows"
  },
