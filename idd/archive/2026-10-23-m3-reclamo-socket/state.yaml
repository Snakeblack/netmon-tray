          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "server.go:145-168 and 92: stale-socket removal (Dial ECONNREFUSED then Remove) is not atomic and is not covered by the history lock when data directories differ. A concurrent start can unlink a live socket, and Close then unlinks the other engine's socket by path.",
                "acceptance_criteria": "Socket ownership is serialized by something keyed to the socket path, such as an flock on a lock file in the control directory held for the life of the server. Alternatively, removal is shown not to be able to delete a socket another engine bound after the probe. A test starts several Listen calls concurrently over one control directory, with no shared history lock, and exactly one succeeds. The others return ErrAlreadyRunning and leave the winner's socket reachable until the winner closes."
              },
              {
                "severity": "SUGGESTION",
                "summary": "server.go:229-236: AcceptUnix errors other than ErrClosed retry immediately with a Warn log and no backoff. Persistent EMFILE/ENFILE gives a hot loop and log flood.",
                "acceptance_criteria": "A persistent, non-closed accept error is retried with a bounded delay or backoff, as net/http does for temporary errors, and logging is rate-limited. A test using a listener stub that returns a repeating error shows the loop does not iterate faster than the delay, and that Close still stops it promptly."
              }
            ]
          },
