  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Dos motores lanzados a la vez pueden compartir el historial o dejar sin socket al primero: el reclamo del socket no es atomico, EADDRINUSE no cuenta como motor en marcha y cualquier error de conexion se toma como socket huerfano",
    "acceptance": "Con dos motores lanzados a la vez sobre los mismos datos, exactamente uno abre el historial y sirve el socket y el otro sale con 1 sin abrirlo; un error de conexion distinto de ECONNREFUSED o ENOENT nunca borra el socket"
  },
  "facts": {
    "open": [
      "Que mecanismo garantiza la exclusion mutua entre motores y donde vive?",
      "Si el socket no se puede crear pero el motor tiene la exclusion, sigue solo con bandeja?"
    ]
  },
