              {
                "severity": "WARNING",
                "summary": "internal/adapter/storage/sqlite.go:40-54. The history file is created with the default mode (0644 minus umask) during migrate(), and only the main file is chmod'ed to 0600 afterwards. The -wal and -shm sidecars are created while the main file is still world-readable and are never chmod'ed. MkdirAll(0o700) does not tighten a directory that already exists. When the data directory is not 0700, other local users can read the outage history during the first run.",
                "acceptance_criteria": "On first creation of the history, the main file, history.db-wal and history.db-shm are never group- or world-accessible. This holds even when the data directory already exists with mode 0755 and umask is 022. A test covers that case and asserts the mode of the sidecar files while the store is open."
              }
            ]
