{
  "schema": "idd-state/v1",
  "change": "m1-walking-skeleton",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "continua con M1 (walking skeleton) según docs/roadmap.md",
    "kind": "feature",
    "summary": "Motor Go de proceso único: sondas por capas sin privilegios, clasificación de cortes, historial local versionado e icono SNI con el estado real, con logs estructurados",
    "acceptance": "Al ejecutar el binario en Omarchy el icono SNI refleja si hay conexión y en qué capa falla; un corte real o simulado queda guardado con inicio, duración y clasificación y sobrevive a reiniciar el proceso"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué intervalo de sondeo en segundos, qué objetivos (wlan0, gateway ICMP, 1.1.1.1/8.8.8.8, DNS) y cuántos fallos consecutivos declaran un corte?"
      },
      {
        "category": "uniqueness",
        "question": "¿Dos caídas separadas por menos de N segundos se fusionan en un único corte, y con qué N?"
      },
      {
        "category": "persistence",
        "question": "¿Qué biblioteca y formato guarda el historial: SQLite puro Go (modernc.org/sqlite), bbolt o JSON Lines propio, y en qué ruta bajo ~/.local/share?"
      },
      {
        "category": "copy",
        "question": "¿Qué textos y etiquetas de capa muestran el tooltip y el menú del icono (idioma español, nombres wifi/router/línea/operador)?"
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "docs/architecture/technical-baseline.md",
          "line": 48
        }
      },
      {
        "category": "accessibility",
        "question": "¿El icono distingue los estados solo por color o también por forma/tooltip, y con cuántos estados (ok, degradado, caído por capa)?"
      },
      {
        "category": "errors",
        "question": "¿Qué hace el motor si falla la escritura del historial o no hay barra SNI: sigue registrando y reintenta cada N segundos, o termina?"
      }
    ]
  },
