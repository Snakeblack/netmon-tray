  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "Un único binario cmd/netmon-tray: el motor sondea, clasifica y escribe el historial en el mismo proceso; el icono solo recibe estado."
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "internal/domain no importa adaptadores; sondas, almacén, bandeja y logging viven en internal/adapter, y las sondas de Linux están tras archivos route_linux.go/route_other.go."
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "Almacén SQLite con único escritor, user_version y migración al abrir, permisos 0600. La rotación a 60 días y la exportación no están en M1: el roadmap las asigna a M2."
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "conforms",
      "reason": "Sondas por capas (enlace, gateway ICMP, internet ICMP, DNS) sin root vía ping sockets; clasifica en la capa más cercana que falla."
    },
    {
      "kind": "scenario",
      "id": "durable-history",
      "impact": "conforms",
      "reason": "Reapertura y migración probadas; rotación y exportación quedan para M2 según el roadmap."
    },
    {
      "kind": "scenario",
      "id": "live-status",
      "impact": "conforms",
      "reason": "El motor publica el estado en cada muestra a un Sink; el contrato de control llega en M3 y el icono no hace E/S de red."
    },
    {
      "kind": "scenario",
      "id": "minimal-footprint",
      "impact": "conforms",
      "reason": "Intervalo fijo de 2 s, 3 ICMP y 1 DNS cada 10 s; medido manualmente en este equipo."
    },
    {
      "kind": "scenario",
      "id": "short-outage-detection",
      "impact": "conforms",
      "reason": "Clasificador y tracker con secuencias simuladas; con 2 s y 3 fallos solo se registran cortes de unos 6 s o más, según lo confirmado por el usuario."
    }
  ],
  "attestations": [
    {
      "kind": "adr",
