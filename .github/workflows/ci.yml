name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      # Node 22 takes a directory for a module to run, so pass the files.
      - run: node --test omarchy-plugin/*.test.js
