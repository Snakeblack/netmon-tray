name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      # Node 22 takes a directory for a module to run, so pass the files.
      - run: node --test omarchy-plugin/*.test.js

  # The Windows adapters (registry, ACL, IcmpSendEcho) only run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The real binaries: Run key, engine probing, ctl and a second engine.
      - name: Smoke test
        shell: pwsh
        run: ./.github/scripts/windows-smoke.ps1
